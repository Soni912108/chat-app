<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/public/js/socketClient.js"></script>
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/navbar.js"></script>
  <script defer src="/public/js/notifications.js"></script>
  <title>Notifications</title>
</head>
<body class="app-page">
  <nav class="profile-nav app-nav">
    <a class="brand-mark" href="/dashboard">Chat App</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="goToProfile()" class="nav-button">Profile</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <main class="notifications-container">
    <section class="page-heading">
      <p class="eyebrow">Inbox</p>
      <h1>Notifications</h1>
    </section>
    <p class="dashboard-error" id="error"></p>
    <div id="status" class="status-bar">
      <strong>Status:</strong> <span id="status-text">Loading...</span>
    </div>
    <div class="notification-actions">
      <button id="markAllRead" class="nav-button">Mark all as read</button>
    </div>
    <ul id="notifications-list"></ul>
    <div class="list-pagination">
      <button id="notificationsPrevPage" class="nav-button">Prev</button>
      <span id="notificationsPageInfo"></span>
      <button id="notificationsNextPage" class="nav-button">Next</button>
    </div>
  </main>
</body>
</html>
