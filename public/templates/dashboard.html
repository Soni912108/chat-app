<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/public/js/socketClient.js"></script>
  <script defer src="/public/js/uiFeedback.js"></script>
  <script type="module" src="/public/js/dashboardScript.mjs"></script>
  <script defer src="/public/js/navbar.js"></script>
  <script defer src="/public/js/notificationCount.js"></script>
</head>
<body class="app-page">
  <nav class="dashboard-nav app-nav">
    <a class="brand-mark" href="/dashboard">Chat App</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications<span id="notification-count"></span></button>
      <button onclick="goToProfile()" id="profile" class="nav-button">Profile</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="updateUserProfile()" class="nav-button">Update Profile</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <p class="connection-error" id="connection-error"></p>

  <main class="dashboard-main">
    <section class="page-heading">
      <p class="eyebrow">Rooms</p>
      <h1>Create or join a conversation</h1>
    </section>
    <p class="dashboard-error" id="error"></p>
    <section id="room-selection" class="room-selection">
      <div class="join-room">
        <div class="section-header">
          <h2>Available rooms</h2>
          <div class="lds-ellipsis" id="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
        </div>
        <label for="roomSearchInput">Search rooms</label>
        <div class="search-row">
          <input id="roomSearchInput" type="search" placeholder="Search by room name">
          <button id="roomSearchButton" class="nav-button">Search</button>
        </div>
        <ul id="rooms"></ul>
        <div class="list-pagination">
          <button id="roomsPrevPage" class="nav-button">Prev</button>
          <span id="roomsPageInfo"></span>
          <button id="roomsNextPage" class="nav-button">Next</button>
        </div>
      </div>
      <div class="create-room">
        <h2>Create room</h2>
        <label for="newRoomName">Room name</label>
        <input id="newRoomName" placeholder="Design team, Family, Project alpha">
        <label for="privacy">Privacy</label>
        <select name="add-privacy" id="privacy">
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
        <button id="createRoomButton">Create Room</button>
      </div>
    </section>
  </main>
</body>
</html>
