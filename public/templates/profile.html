<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile</title>
  <link rel="stylesheet" href="/public/css/style.css">
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/navbar.js"></script>
  <script defer src="/public/js/profile.js"></script>
</head>
<body class="app-page">
  <nav class="profile-nav app-nav">
    <a class="brand-mark" href="/dashboard">Chat App</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications</button>
      <button onclick="goToProfile()" id="profile" class="nav-button">Profile</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="updateUserProfile()" class="nav-button">Update Profile</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <main class="profile-container">
    <section class="profile-hero">
      <div class="profile-avatar">
        <img src="" alt="Profile Avatar" id="profile-avatar">
      </div>
      <div class="profile-details">
        <p class="eyebrow">Profile</p>
        <h1 id="profile-username" class="profile-username">Username</h1>
        <p id="email" class="profile-email"></p>
        <p id="joined-date" class="profile-joined-date"></p>
        <p id="last-login" class="profile-last-login">Last login:</p>
      </div>
    </section>

    <section class="activity-stats">
      <h2>Activity</h2>
      <p id="rooms-created-count">Rooms Created:</p>
      <p id="rooms-joined-count">Rooms Joined:</p>
      <p id="messages-sent-count">Messages Sent:</p>
    </section>

    <section class="profile-grid">
      <div class="profile-section">
        <h2>Rooms created</h2>
        <ul id="rooms-created" class="room-list"></ul>
      </div>
      <div class="profile-section recent-activity">
        <h2>Recent activity</h2>
        <ul id="recent-activity-list"></ul>
      </div>
    </section>

    <section class="settings-preferences">
      <h2>Settings</h2>
      <form id="settings-form">
        <label for="theme">Theme</label>
        <select name="theme" id="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <button type="submit" class="settings-button">Update Settings</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('settings-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const theme = document.getElementById('theme').value;

      try {
        const response = await fetch('/api/user/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ theme: theme }),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message);
        }

        const data = await response.json();
        applyTheme(data.settings);
        showToast('Settings updated', 'success');
      } catch (error) {
        showToast(error.message || 'Error updating settings', 'error');
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/api/user/settings', {
          method: 'GET',
          credentials: 'include',
        });

        if (!response.ok) return;
        const data = await response.json();
        if (data.settings && data.settings.theme) {
          document.getElementById('theme').value = data.settings.theme;
        }
      } catch (error) {}
    });
  </script>
</body>
</html>
