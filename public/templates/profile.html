<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.css">
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/navbar.js"></script>
  <script defer src="/public/js/profile.js"></script>
  <script defer src="/public/js/profileSettings.js"></script>
</head>
<body class="app-page">
  <nav class="profile-nav app-nav">
    <a class="brand-mark" href="/dashboard">Roomloop</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="goToProfile()" class="nav-button">Profile</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <main class="profile-container">
    <section class="profile-hero">
      <div class="profile-hero-header">
        <h2 class="section-title profile-section-title">Profile</h2>
        <button type="button" class="nav-button icon-button profile-edit-button" id="editProfileButton" aria-label="Edit profile" title="Edit profile">
          <span aria-hidden="true">&#9998;</span>
        </button>
      </div>
      <div class="profile-hero-body">
        <div class="profile-avatar">
          <img src="" alt="Profile Avatar" id="profile-avatar">
        </div>
        <div class="profile-details">
          <h1 id="profile-username" class="profile-username">Username</h1>
          <p id="email" class="profile-email"></p>
          <p id="joined-date" class="profile-joined-date"></p>
          <p id="last-login" class="profile-last-login">Last login:</p>
        </div>
      </div>
    </section>

    <section class="activity-stats">
      <h2>Activity</h2>
      <p id="rooms-created-count">Rooms Created:</p>
      <p id="rooms-joined-count">Rooms Joined:</p>
    </section>

    <section class="profile-section profile-rooms-section">
      <div class="profile-section-header">
        <h2>Rooms created</h2>
        <a class="nav-button profile-section-link" href="/dashboard?scope=mine">View all</a>
      </div>
      <ul id="rooms-created" class="room-list"></ul>
    </section>

    <section class="settings-preferences">
      <h2>Settings</h2>
      <p class="settings-description">Update your account, security, avatar, and theme from here.</p>
      <div class="profile-settings-actions">
        <button type="button" class="nav-button" id="changePasswordButton">Change Password</button>
        <button type="button" class="nav-button" id="updateAvatarButton">Update Avatar</button>
        <button type="button" class="nav-button" id="themeButton">Theme</button>
      </div>
    </section>
  </main>

</body>
</html>
