<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Profile</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/public/css/style.css">
  <script defer src="/public/js/uiFeedback.js"></script>
</head>
<body class="app-page">
  <nav class="update-nav app-nav">
    <a class="brand-mark" href="/dashboard">Chat App</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="goBackToProfile()" class="nav-button">Cancel</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <main class="update-container">
    <section class="update-card">
      <p class="eyebrow">Avatar</p>
      <h1 class="update-title">Update your avatar</h1>
      <form id="avatar-upload-form" enctype="multipart/form-data">
        <label for="avatar-input" class="custom-file-upload">Choose image</label>
        <input type="file" name="avatar" id="avatar-input" accept="image/*">
        <button type="submit">Upload Avatar</button>
      </form>
    </section>

    <section class="update-card">
      <p class="eyebrow">Security</p>
      <h1 class="update-title">Change password</h1>
      <form id="changePasswordForm" class="update-form">
        <div class="form-group">
          <label for="old-password">Old Password</label>
          <input type="password" name="old-password" id="old-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" name="new-password" id="new-password" required>
        </div>
        <div class="form-group">
          <label for="repeat-password">Repeat New Password</label>
          <input type="password" name="repeat-password" id="repeat-password" required>
        </div>
        <div id="error-message" class="error-message"></div>
        <button type="submit" class="update-button">Change Password</button>
      </form>
    </section>
  </main>

  <script defer src="/public/js/updateUser.js"></script>
  <script defer src="/public/js/navbar.js"></script>
</body>
</html>
