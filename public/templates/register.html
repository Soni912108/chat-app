<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="/public/css/style.css">
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/clientAuth.js"></script>
</head>
<body class="auth-page">
  <main class="registerContainer">
    <section id="register" class="auth-panel">
      <p class="eyebrow">Create account</p>
      <h1>Register</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="Choose a username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="Create a password">
      <button onclick="register()">Register</button>
      <div class="lds-spinner" id="lds-spinner"><div></div><div></div><div></div><div></div></div>
      <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
    </section>
  </main>
</body>
</html>
