<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="roomTitle">Room</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="/public/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/public/js/socketClient.js"></script>
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/navbar.js"></script>
</head>
<body class="chat-page">
  <nav class="chat-nav app-nav">
    <a class="brand-mark" href="/dashboard">Chat App</a>
    <div class="app-nav-links">
      <button onclick="goBack()" class="nav-button">Dashboard</button>
      <button onclick="gotoNotification()" id="notification" class="nav-button">Notifications</button>
    </div>
    <div class="app-user-menu">
      <button class="user-menu-trigger" id="username"></button>
      <div class="user-menu-panel">
        <button onclick="goToProfile()" class="nav-button">Profile</button>
        <button class="logout-button" onclick="logout()" id="logout">Logout</button>
      </div>
    </div>
  </nav>

  <main id="chat-room" class="chat-room">
    <section class="room-toolbar">
      <div class="room-toolbar-copy">
        <p class="eyebrow">Current room</p>
        <h1 id="roomName" class="room-name"></h1>
        <p id="roomOwner" class="room-owner"></p>
      </div>

      <div class="room-toolbar-actions">
        <details class="room-dropdown room-members-dropdown">
          <summary>
            <span>Members</span>
            <span id="roomMemberCount" class="room-chip">0</span>
          </summary>
          <div class="room-dropdown-panel room-members-panel">
            <ul id="userList" class="user-list room-member-list">Fetching users...</ul>
          </div>
        </details>

        <button onclick="leaveRoom()" id="leaveRoom" class="nav-button">Leave room</button>

        <details class="room-dropdown room-actions-dropdown" id="roomActionsMenu">
          <summary>Room actions</summary>
          <div class="room-dropdown-panel room-actions-panel">
            <div class="room-settings-group">
              <label for="roomBackgroundTheme" class="room-settings-label">Room background</label>
              <select id="roomBackgroundTheme" class="room-background-select">
                <option value="neutral">Neutral</option>
                <option value="dusk">Dusk</option>
                <option value="forest">Forest</option>
                <option value="ocean">Ocean</option>
                <option value="slate">Slate</option>
                <option value="sunset">Sunset</option>
              </select>
              <button id="saveRoomBackground" class="nav-button">Save background</button>
            </div>
            <div class="room-settings-group">
              <button onclick="renameRoom()" id="renameRoom" class="nav-button">Rename room</button>
              <button onclick="transferOwnership()" id="transferOwnership" class="nav-button">Transfer owner</button>
              <button onclick="banUser()" id="banUser" class="nav-button danger-button">Ban user</button>
              <button onclick="deleteRoom()" id="deleteRoom" class="nav-button danger-button">Delete room</button>
            </div>
          </div>
        </details>
      </div>
    </section>

    <section class="chat-panel">
      <p class="dashboard-error" id="error"></p>
      <div id="messages-container" class="messages-container">
        <ul id="messages" class="messages"></ul>
      </div>
      <p id="typingIndicator" class="typing-indicator"></p>
      <div class="message-input-container">
        <input id="messageInput" autocomplete="off" class="message-input" placeholder="Type a message">
        <button onclick="sendMessage()" class="send-button">Send</button>
      </div>
    </section>
  </main>

  <script defer src="/public/js/chatrooms.js"></script>
  <script>
    const messageInput = document.getElementById('messageInput');

    messageInput.addEventListener('keydown', (event) => {
      if (event.keyCode === 13) {
        sendMessage();
      }
    });

    function goBack(){
      window.location.href = '/dashboard';
    }

    function gotoNotification() {
      window.location.href = '/notification';
    }

    function goToProfile() {
      window.location.href = '/profile';
    }

    function updateUserProfile() {
      window.location.href = '/updateUser';
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        window.location.href = '/login?message=loggedOut';
      } catch (error) {
        window.location.href = '/login?message=loggedOut';
      }
    }
  </script>
</body>
</html>
