<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" type="text/css" href="/public/css/style.css">
  <title>Login</title>
  <script defer src="/public/js/uiFeedback.js"></script>
  <script defer src="/public/js/clientAuth.js"></script>
</head>
<body class="auth-page">
  <main class="loginContainer">
    <section id="login" class="auth-panel">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="Enter your username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
      <button onclick="login()">Login</button>
      <div class="lds-spinner" id="lds-spinner"><div></div><div></div><div></div><div></div></div>
      <p class="auth-switch">Don't have an account? <a href="/register">Register</a></p>
    </section>
  </main>
  <script>
    function showLogoutMessage() {
      const urlParams = new URLSearchParams(window.location.search);
      const message = urlParams.get('message');
      if (message === 'loggedOut') {
        showToast('You have been logged out. Please log in again.', 'info');
      }
    }
    document.addEventListener('DOMContentLoaded', showLogoutMessage);
  </script>
</body>
</html>
